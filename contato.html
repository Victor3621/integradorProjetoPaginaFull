<form action="">

    <label for="nome">Nome:</label>
    <br>
    <input type="text" name="nome" id="nome" required placeholder="Digite seu nome completo">

    <br><br>

    <label for="email">Email:</label>
    <br>
    <input type="email" name="email" id="email" required placeholder="Digite seu email">

    <br><br>

    <label for="telefone">Telefone:</label>
    <br>
    <input type="tel" name="telefone" id="telefone" required placeholder="(00) 00000-0000">

    <br><br>

    <label for="assunto">Assunto:</label>
    <br>
    <input type="text" name="assunto" id="assunto" required placeholder="Digite o assunto">

    <br><br>

    <label for="mensagem">Mensagem:</label>
    <br>
    <textarea name="mensagem" id="mensagem" rows="5" required placeholder="Digite sua mensagem"></textarea>

    <br><br>

    <button type="submit">Enviar Mensagem</button>

</form>

<br>
